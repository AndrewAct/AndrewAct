<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">3D contribution graph placeholder</title>
  <desc id="desc">This placeholder is replaced by the scheduled GitHub Action.</desc>
  <rect width="1280" height="640" rx="24" fill="#0B1220"/>
  <rect x="72" y="80" width="1136" height="480" rx="20" fill="#0F1A2A" stroke="#2D405C"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="640" y="288" fill="#F8FAFC" font-size="34" font-weight="700" text-anchor="middle">3D contribution graph</text>
    <text x="640" y="340" fill="#8DA2BD" font-size="20" text-anchor="middle">Generated daily by GitHub Actions</text>
  </g>
</svg>
